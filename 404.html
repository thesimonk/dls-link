<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dynamic Learning - redirecting...</title>
<script>
  // GitHub Pages serves this project site under /dls-link/ - strip that
  // prefix before forwarding, so /dls-link/update/<token> correctly
  // becomes <tunnel>/update/<token>, not <tunnel>/dls-link/update/<token>
  // (which 404s - the real app has no /dls-link prefix in its routes).
  //
  // This target is now a permanent Tailscale Funnel hostname (set up
  // 2026-10-08, replacing the old Cloudflare quick tunnel) - it does NOT
  // rotate on restart, so this file no longer needs the watchdog script
  // rewriting it after every reconnect. Only touch this if the underlying
  // machine's Tailscale device name or tailnet ever changes.
  var target = "https://dls.taile279ee.ts.net";
  var path = location.pathname.replace(/^\/dls-link/, "");
  location.replace(target + path + location.search);
</script>
<meta http-equiv="refresh" content="0; url=https://dls.taile279ee.ts.net">
</head>
<body>
<p>Redirecting to the Dynamic Learning dashboard... if nothing happens, <a href="https://dls.taile279ee.ts.net">click here</a>.</p>
</body>
</html>
